[project]
name = "livekit-gemini-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepgram-sdk>=5.3.1",
    "opencv-python>=4.12.0.88",
    "twelvelabs>=1.1.0",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.setuptools]
py-modules = ["main", "video_review_server", "video_store", "video_stream_processor", "realtime_video_processor"]

[project.optional-dependencies]
server = [
    "livekit-agents[openai,google,silero,images]~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    "livekit>=1.0.0",
    "numpy>=1.26.0",
    "opencv-python>=4.10.0.84",
    "python-dotenv>=1.2.1",
    "sounddevice>=0.4.6",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "websockets>=12.0",
    "vosk>=0.3.45; platform_system != 'Darwin'",
    "faster-whisper>=1.0.3; platform_system == 'Darwin'",
    "tensorflow>=2.15.0",
    "tensorflow-hub>=0.16.0",
    "scipy>=1.11.0",
    "deepgram-sdk>=3.0.0",
    "openai>=1.0.0",
    "twelvelabs>=0.1.0",
]
